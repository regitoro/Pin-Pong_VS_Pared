<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong vs Pared</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

    <style>
        :root{
            --morado: #a855f7;
            --morado-claro: #e9a8ff;
            --morado-oscuro: #3b0764;
            --rosa: #f472b6;
            --cian: #22d3ee;
            --fondo: #0b0614;
            --texto: #f3e8ff;
            --texto-suave: #b9a3cf;
        }
        *{ box-sizing: border-box; }
        body{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            margin:0;
            padding: 16px;
            color: var(--texto);
            font-family: "Poppins", sans-serif;
            flex-direction:column;
            background:
                radial-gradient(circle at 20% 10%, rgba(168, 85, 247, 0.25), transparent 45%),
                radial-gradient(circle at 85% 90%, rgba(244, 114, 182, 0.18), transparent 45%),
                var(--fondo);
        }
        h1, h2, h3{
            font-family: "Orbitron", sans-serif;
            letter-spacing: 2px;
        }
        .titulo{
            margin: 0 0 18px;
            font-size: clamp(18px, 3vw, 30px);
            font-weight: 900;
            text-transform: uppercase;
            text-align: center;
            background: linear-gradient(90deg, var(--morado-claro), var(--rosa), var(--cian));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.6));
        }
        canvas{
            max-width: 100%;
            height: auto;
            border-radius: 18px;
            border: 2px solid rgba(233, 168, 255, 0.5);
            box-shadow:
                0 0 0 6px rgba(168, 85, 247, 0.08),
                0 0 30px rgba(168, 85, 247, 0.55),
                0 0 80px rgba(244, 114, 182, 0.2);
        }
        .ayuda{
            margin-top: 18px;
            color: var(--texto-suave);
            text-align: center;
        }
        kbd{
            display: inline-block;
            min-width: 26px;
            padding: 2px 8px;
            margin: 0 2px;
            border-radius: 6px;
            border: 1px solid rgba(233, 168, 255, 0.4);
            border-bottom-width: 3px;
            background: rgba(168, 85, 247, 0.15);
            color: var(--texto);
            font-family: "Orbitron", sans-serif;
            font-size: 13px;
        }
        /* pantallas superpuestas (inicio y resultados) */
        #PantallaInicio, #PantallaResultados{
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px;
            background: rgba(5, 2, 12, 0.82);
            backdrop-filter: blur(6px);
            z-index: 10;
        }
        .tarjeta{
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            width: min(560px, 100%);
            max-height: 100%;
            overflow-y: auto;
            padding: 32px 28px;
            border-radius: 22px;
            background: linear-gradient(160deg, rgba(59, 7, 100, 0.85), rgba(20, 8, 38, 0.95));
            border: 1px solid rgba(233, 168, 255, 0.35);
            box-shadow: 0 0 40px rgba(168, 85, 247, 0.45);
            animation: aparecer 0.35s ease-out;
        }
        @keyframes aparecer{
            from{ opacity: 0; transform: translateY(16px) scale(0.97); }
            to{ opacity: 1; transform: none; }
        }
        .tarjeta h2{ margin: 0; font-size: 24px; color: var(--morado-claro); text-align: center; }
        .tarjeta h3{ margin: 10px 0 0; font-size: 14px; color: var(--texto-suave); text-transform: uppercase; }
        .subtitulo{ margin: 0; color: var(--texto-suave); text-align: center; }
        #PantallaInicio input{
            width: 100%;
            font-family: inherit;
            font-size: 18px;
            padding: 12px 16px;
            border-radius: 12px;
            border: 2px solid rgba(233, 168, 255, 0.35);
            background: rgba(11, 6, 20, 0.7);
            color: var(--texto);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        #PantallaInicio input::placeholder{ color: #7c6a93; }
        #PantallaInicio input:focus{
            border-color: var(--morado-claro);
            box-shadow: 0 0 14px rgba(168, 85, 247, 0.6);
        }
        .boton{
            font-family: "Orbitron", sans-serif;
            font-weight: 700;
            font-size: 16px;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 12px 30px;
            border: none;
            border-radius: 12px;
            color: #fff;
            background: linear-gradient(90deg, var(--morado), var(--rosa));
            box-shadow: 0 0 18px rgba(244, 114, 182, 0.5);
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .boton:hover{ transform: translateY(-2px); box-shadow: 0 0 28px rgba(244, 114, 182, 0.8); }
        .boton:active{ transform: translateY(1px); }
        /* pantalla de resultados, oculta hasta que el jugador pierde */
        #PantallaResultados{
            display: none;
        }
        #PantallaResultados .tarjeta h2{
            font-size: 30px;
            color: var(--rosa);
            text-shadow: 0 0 18px rgba(244, 114, 182, 0.7);
        }
        #PantallaResultados table{
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(233, 168, 255, 0.25);
            font-size: 14px;
        }
        #PantallaResultados th, #PantallaResultados td{
            padding: 9px 10px;
            text-align: center;
        }
        #PantallaResultados th{
            background: rgba(168, 85, 247, 0.35);
            color: #fff;
            font-family: "Orbitron", sans-serif;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        #PantallaResultados td{
            border-top: 1px solid rgba(233, 168, 255, 0.12);
            background: rgba(11, 6, 20, 0.45);
        }
        /* medallas para el top 3 */
        #tablaMejores tr:nth-child(1) td:first-child{ color: #fcd34d; font-weight: bold; }
        #tablaMejores tr:nth-child(2) td:first-child{ color: #e5e7eb; font-weight: bold; }
        #tablaMejores tr:nth-child(3) td:first-child{ color: #f59e0b; font-weight: bold; }
        /* resalta la partida actual si entró al top 3 */
        #PantallaResultados tr.actual td{
            background: rgba(244, 114, 182, 0.25);
            font-weight: bold;
        }
        .tarjeta .boton{ margin-top: 10px; }
        .pista{ margin: 0; font-size: 12px; color: #7c6a93; }
    </style>
</head>
<body>

    <div id="PantallaInicio">
        <div class="tarjeta">
            <h2>Pong vs Pared</h2>
            <p class="subtitulo">¿Cómo te llamas?</p>
            <input
                type="text"
                id="nombre"
                placeholder="Nombre del jugador..."
                maxlength="20"
                autocomplete="off"
                autofocus
            >
            <button class="boton" onclick="entrar()">Entrar</button>
            <p class="pista">o presiona Enter</p>
        </div>
    </div>

    <div id="PantallaResultados">
        <div class="tarjeta">
            <h2>¡Perdiste!</h2>

            <h3>Tu partida</h3>
            <table>
                <thead>
                    <tr><th>Jugador</th><th>Score</th><th>Nivel</th><th>Fecha</th></tr>
                </thead>
                <tbody id="tablaPartidaActual"></tbody>
            </table>

            <h3>Top 3 mejores scores</h3>
            <table>
                <thead>
                    <tr><th>#</th><th>Jugador</th><th>Score</th><th>Nivel</th><th>Fecha</th></tr>
                </thead>
                <tbody id="tablaMejores"></tbody>
            </table>

            <button class="boton" onclick="jugarDeNuevo()">Jugar de nuevo</button>
            <p class="pista">o presiona Enter</p>
        </div>
    </div>

    <h1 class="titulo">Entrenamiento: Pong vs Pared</h1>
    <!--canvas de 800 x 450  -->
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    <p class="ayuda">Mueve la paleta con <kbd>R</kbd> / <kbd>F</kbd> o <kbd>↑</kbd> / <kbd>↓</kbd></p>

    <script src="game.js"></script>

</body>
</html>
